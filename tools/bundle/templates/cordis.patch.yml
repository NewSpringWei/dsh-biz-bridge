# dsh-biz-bridge profile 配置模板（便携包用）
#
# 构建时由 tools/bundle/bundle.mjs 复制进产物 program/templates/。
# 部署时把它复制到 <包根>/runtime/profiles/bizbridge/cordis.patch.yml 再按注释修改。
#
# 路径说明：runtime.path 用相对路径 ./runtime，由 wrapper 固定的 cwd（包根）解析，
# 因此整个目录换盘/换机器/改名都不必改配置。

# 1) HTTP 载体：插件的 /bizbridge 前缀挂在它上面
- insert:
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: "127.0.0.1"          # 只监听本机（默认，最安全）。
                                   # 需局域网访问才改 0.0.0.0，并务必配合防火墙；
                                   # 前置 nginx 时注意 SSE（见产物 readme.md）。
        port: 42731
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

# 2) LLM 默认模型 —— 独立部署必须配，否则每个 agent 轮次都失败
#    现象：服务能启动、接口全正常，但请求报 has no provider/model。
#    本节覆盖 dsh-base 自带的 agent-default-model 行。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

# 3) API Key **不在这里**。
#    llm-deepseek 只认环境变量名（apiKeyEnv，默认 DEEPSEEK_API_KEY），
#    secret 落在 <包根>/runtime/.credentials.yaml。
#    **别手改那个文件**：用 dsh-web.cmd 启动官方设置界面填写，由官方途径写入。

# 4) 插件配置
- id: dsh-biz-bridge
  config:
    runtime:
      # 相对路径按 DSH 进程 cwd 解析；wrapper 固定 cwd=包根，故整个目录可搬移。
      path: ./runtime
    database:
      journalMode: "WAL"
      busyTimeout: 5000
    auth:
      timestampWindow: 300
      nonceCacheSize: 10000
      # client 公钥表**不在这里** —— 它在 <runtime>/clients/ 下，改动即时生效、无需重启：
      #   clients/clients.json     [{ clientId, scope, enabled }]
      #   clients/<clientId>.pem   该 client 的公钥（SPKI PEM，整段原文）
      # 详见 runtime/README.txt。本键只在那个目录尚未建立时作为**一次性迁移来源**，
      # 之后不再参与运行；首次部署保持空数组即可（空表 = 所有 API 返回 401、静态页可达）。
      clients: []
    scheduler:
      pollInterval: 2
      maxConcurrency: 5
      callbackTimeout: 30
      maxRetry: 3
      retryInterval: 30

    # agent 侧安全约束：业务系统转发的 prompt 与附件一律按不可信输入处理
    security:
      policySection: true        # 把「输入不可信」策略写入 agent 系统提示词
      sandboxMode: default       # 改 read-only 即禁止 agent 写/删文件（出站产物随之失效）
      denyTools: []              # 按宿主实际工具集填写，例如 [bash, pwsh, web_search, web_fetch]

    # 附件转接（入站拉取 / 出站产物发现）
    attachments:
      denyInternalHosts: true    # SSRF 防护：拒绝内网地址（含 IPv4 映射等写法）
      # 内网联调（回调地址指向本机）时必须显式放开，且**仅**放开回调：
      # allowInternalCallbackHosts: true
      # allowedHosts: ["files.biz.example.com"]   # 收紧拉取来源（空 = 不限制）
