# dsh-biz-bridge —— profile bizbridge 用户层补丁（示例）
#
# 将本文件内容整体覆盖到 $DSH_HOME/profiles/bizbridge/cordis.patch.yml
# （默认文件只是注释 + []，可直接替换）。字段逐项说明见同目录 config.md。
#
# 分层说明（仅注释）：
#   - 首次 dsh plugin --profile bizbridge add <tgz> 已把该 profile 初始化为
#     bundles=[@deepseek-ai/dsh-base]，并把本插件装成第二个 bundle 层；
#   - 本文件属于用户层（最后应用）：只负责“宿主行（webServer）”与本插件 config。
#
# 注意：本文件是 YAML 补丁列表，不要在里面夹带 Markdown 围栏或非注释说明文本。

# 1) HTTP 载体：插件的 /bizbridge 前缀挂在它上面
#    host/port 按需修改：port 默认 42731（改端口就改这一行）。
#    安全语义：127.0.0.1 只监听本机（推荐默认，最安全）；
#    需要局域网/外部访问才改成 0.0.0.0，并务必配合防火墙。
- insert:
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: "127.0.0.1"
        port: 42731        # 端口：按需修改（示例值，无特殊含义）
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

# 2) （默认不设置）业务 agent 系统提示词
#    业务桥接场景下，业务意图由每次请求的 prompt 表达，不建议套用
#    “coding agent”式人设。需要自定义时再取消下面注释并按需改写：
# - id: system-prompt
#   config:
#     persona: >-
#       你是业务系统的执行代理；上下文以业务方提供的会话为准。

# 3) LLM 默认模型 —— **独立部署（无 dsh web）必须配**
#    不配的现象：服务能启动、HTTP 接口全部正常返回，但每个 agent 轮次都失败，
#    报 has no provider/model。
#    本节覆盖 dsh-base 自带的 agent-default-model 行。
#    若宿主已通过其它方式配好默认模型（例如用过 dsh web 的设置界面），可删掉本节。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

#    ⚠️ API Key **不在这里**。llm-deepseek 的配置项只有 apiKeyEnv（**环境变量名**，
#       默认 DEEPSEEK_API_KEY），没有 apiKey 字段。
#       key 放 <DSH_HOME>/.credentials.yaml（可直接编辑，改后无需重启即生效）
#       或启动环境变量。解析优先级：环境变量 > .credentials.yaml > 项目 .env。
#       详见 config.md §4.2。

# 4) 插件配置
- id: dsh-biz-bridge
  config:
    runtime:
      # 单一磁盘根（绝对路径，推荐）。自动派生子目录：
      #   <runtime>/data/dsh-biz-bridge.db   SQLite
      #   <runtime>/logs/                    运行日志（按天轮转）
      #   <runtime>/workspace/<clientId>/    各业务 client 的会话工作目录
      #   Linux（服务器）：
      #     path: /var/lib/dsh-bizbridge/runtime
      #   Windows（本地开发，盘符按需）：
      path: E:/dsh-biz-bridge/runtime
    database:
      journalMode: "WAL"
      busyTimeout: 5000
    auth:
      timestampWindow: 300
      nonceCacheSize: 10000
      # client 公钥表**不在这里** —— 它在 <runtime>/clients/ 下，改动即时生效、无需重启：
      #   clients/clients.json     [{ clientId, scope, enabled }]
      #   clients/<clientId>.pem   该 client 的公钥（SPKI PEM，整段原文）
      # 本键只在那个目录尚未建立时作为**一次性迁移来源**，之后不再参与运行；
      # 首次部署保持空数组即可（空表 = 所有 API 返回 401、静态页可达）。
      clients: []
    scheduler:
      pollInterval: 2
      maxConcurrency: 5
      callbackTimeout: 30
      maxRetry: 3
      retryInterval: 30
